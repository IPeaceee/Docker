networks:
  rancher-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  rancher:
    image: rancher/rancher:v2.12.3  # Use specific stable version for production
    container_name: rancher-server
    hostname: rancher-server
    restart: unless-stopped
    
    # Network configuration
    networks:
      - rancher-network
    ports:
      - "80:80"
      - "443:443"
    
    # Environment variables
    environment:
      # Bootstrap & Authentication
      - CATTLE_BOOTSTRAP_PASSWORD=${RANCHER_BOOTSTRAP_PASSWORD:-Admin123!}
      - CATTLE_PASSWORD_MIN_LENGTH=8
      - CATTLE_TLS_MIN_VERSION=1.2
      - CATTLE_TLS_CIPHERS=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      
      # Registry Configuration
      - CATTLE_SYSTEM_DEFAULT_REGISTRY=registry.rancher.com
      - CATTLE_AGENT_IMAGE=rancher/rancher-agent:v2.8.5
      
      # Audit Logging
      - AUDIT_LEVEL=2
      - AUDIT_LOG_PATH=/var/log/auditlog/rancher-api-audit.log
      - AUDIT_LOG_MAXAGE=10
      - AUDIT_LOG_MAXBACKUP=5
      - AUDIT_LOG_MAXSIZE=100
      
      # Performance & Limits
      - CATTLE_NAMESPACE_MAX=100
      - CATTLE_PROJECT_MAX=50
      
      # Feature Flags
      - CATTLE_FEATURES=multi-cluster-management=true
      
      # Session & Token
      - CATTLE_SESSION_TIMEOUT_MINUTES=960
      - CATTLE_AUTH_TOKEN_MAX_TTL_MINUTES=129600
    
    # Resource limits (for docker-compose)
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.0
    
    # Volume mounts
    volumes:
      - rancher_data:/var/lib/rancher
      - rancher_logs:/var/log/auditlog
      - /etc/localtime:/etc/localtime:ro
    
    # Temporary file systems for better performance
    tmpfs:
      - /run
      - /tmp
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    
    # Security configurations for internal use
    privileged: true  # Required for Rancher to manage containers
    # Note: For internal environments, privileged mode is acceptable

volumes:
  rancher_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./rancher_data
  rancher_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./rancher_logs